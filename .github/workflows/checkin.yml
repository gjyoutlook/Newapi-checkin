name: NewAPI 自动签到

on:
  # 提前在北京时间 07:50 启动准备；实际签到在 08:00—09:00 内随机执行
  schedule:
    - cron: '50 23 * * *'
  # 手动触发
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: playwright install chromium --with-deps

      - name: 确认 Chrome 与 xvfb
        run: |
          google-chrome --version
          which xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: 随机等待至北京时间 08:00—09:00（手动运行立即执行）
        id: window
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { randomInt } = require('node:crypto');
          
          async function main() {
            const scheduled = process.env.GITHUB_EVENT_NAME === 'schedule';
            let runCheckin = true;
            if (scheduled) {
              const now = Date.now();
              const hour = 60 * 60 * 1000;
              const day = 24 * hour;
              const offset = 8 * hour;
              const start = Math.floor((now + offset) / day) * day - offset + 8 * hour;
              const end = start + hour;
              if (now >= end) {
                console.log('已超过北京时间 09:00，跳过今天的定时签到。');
                runCheckin = false;
              } else {
                const target = randomInt(Math.max(now, start), end);
                const beijingTime = new Date(target + offset).toISOString().slice(0, 19).replace('T', ' ');
                console.log(`随机签到时间（北京时间）：${beijingTime}`);
                await new Promise(resolve => setTimeout(resolve, Math.max(0, target - Date.now())));
                const actual = Date.now();
                runCheckin = actual >= start && actual < end;
                if (!runCheckin) console.log('等待结束时已超出 08:00—09:00，跳过今天的定时签到。');
              }
            } else {
              console.log('手动运行：立即签到。');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_checkin=${runCheckin}\n`);
          }
          
          main().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: 执行签到（xvfb 虚拟显示，含 Turnstile 解验证）
        if: steps.window.outputs.run_checkin == 'true'
        env:
          CONFIG_URL: ${{ secrets.CONFIG_URL }}
          CONFIG_AUTH: ${{ secrets.CONFIG_AUTH }}
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: xvfb-run --auto-servernum python checkin.py
