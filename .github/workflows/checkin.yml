name: NewAPI 自动签到

on:
  # 北京时间 07:50 启动，08:00—09:00 随机签到；延迟时立即补签
  schedule:
    - cron: '50 23 * * *'
    # 北京时间 18:37 再次兜底；当天已签到会正常返回
    - cron: '37 10 * * *'
  # 手动触发
  workflow_dispatch:

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: playwright install chromium --with-deps

      - name: 确认 Chrome 与 xvfb
        run: |
          google-chrome --version
          which xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: 早晨随机等待，延迟时立即补签
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { randomInt } = require('node:crypto');
          
          async function main() {
            let note;
            if (process.env.GITHUB_EVENT_NAME === 'schedule') {
              const now = Date.now();
              const hour = 60 * 60 * 1000;
              const day = 24 * hour;
              const offset = 8 * hour;
              const start = Math.floor((now + offset) / day) * day - offset + 8 * hour;
              const end = start + hour;
              if (now < end) {
                const target = randomInt(Math.max(now, start), end);
                const beijingTime = new Date(target + offset).toISOString().slice(0, 19).replace('T', ' ');
                note = `计划签到时间（北京时间）：${beijingTime}；如等待或调度延迟则立即补签。`;
                console.log(note);
                await new Promise(resolve => setTimeout(resolve, Math.max(0, target - Date.now())));
              } else {
                note = '已超过北京时间 09:00：立即执行当天补签，不再跳过。';
                console.log(note);
              }
            } else {
              note = '手动运行：立即签到。';
              console.log(note);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${note}\n\n`);
          }
          
          main().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: 执行签到（xvfb 虚拟显示，含 Turnstile 解验证）
        env:
          CONFIG_URL: ${{ secrets.CONFIG_URL }}
          CONFIG_AUTH: ${{ secrets.CONFIG_AUTH }}
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "签到尝试 $attempt/3"
            if xvfb-run --auto-servernum python checkin.py; then
              echo "✅ 签到脚本执行成功（包含今日已签到），详情见日志。" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 60))
            fi
          done
          echo "❌ 连续三次签到失败，请检查站点与凭证；晚间兜底任务仍会再次尝试。" >> "$GITHUB_STEP_SUMMARY"
          exit 1
